<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryDiary - Your Narrative Journal</title>
    <!-- Fonts load in the background so they can never block the page -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>body{margin:0;background:#050a05;color:#a8a29e;font-family:system-ui,sans-serif}</style>
  </head>
  <body>
    <div id="root">
      <div style="padding:2rem;text-align:center">
        Loading StoryDiary…
        <noscript><p>Please enable JavaScript.</p></noscript>
      </div>
    </div>
    <script>
      // If the app has not started after 8s, show a hint instead of loading forever.
      setTimeout(function () {
        var r = document.getElementById('root');
        if (r && r.textContent && r.textContent.indexOf('Loading StoryDiary') === 0 && r.children.length === 1) {
          r.innerHTML = '<div style="padding:2rem;text-align:center;max-width:32rem;margin:auto">The app did not start. Open the browser console (F12) to see the error. If you opened index.html directly or deployed the source folder, run <b>npm run build</b> and deploy the <b>dist</b> folder.</div>';
        }
      }, 8000);
      window.addEventListener('error', function (e) {
        var r = document.getElementById('root');
        if (r && r.children.length === 1) r.innerHTML = '<pre style="padding:1rem;white-space:pre-wrap;color:#f87171">Error: ' + (e.message || e) + '</pre>';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
